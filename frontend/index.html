<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_BotFlow.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>BotFlow</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- DEV-ONLY: мок API для локального теста без Telegram (активен при ?mock=1). Не для продакшена. -->
    <script src="/mock-api.js"></script>
    <script>
      // Глобальный перехватчик вообще всех ошибок до запуска React
      window.addEventListener("error", function (e) {
        // ResizeObserver loop — известное безвредное предупреждение браузера,
        // не влияющее на работу приложения. Не показываем пользователю.
        if (e.message && e.message.includes("ResizeObserver loop")) {
          return;
        }
        alert("JS Error: " + e.message + " at " + e.filename + ":" + e.lineno);
      });
      window.addEventListener("unhandledrejection", function (e) {
        alert(
          "Promise Rejection: " +
            (e.reason && e.reason.message ? e.reason.message : e.reason),
        );
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
