services:
  postgres_db:
    image: postgres:15-alpine
    container_name: funnel_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./backend/database/data:/var/lib/postgresql/data

# Удаляем именованный volume, так как перешли на локальную папку
# volumes:
#   postgres_data:
