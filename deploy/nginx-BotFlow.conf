# Nginx config for BotFlow
# Place at: /etc/nginx/sites-available/botflow.malinaezo.ru
# Then: ln -s /etc/nginx/sites-available/botflow.malinaezo.ru /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name botflow.malinaezo.ru;

    # SSL (certbot заполнит это автоматически)
    # ssl_certificate /etc/letsencrypt/live/botflow.malinaezo.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/botflow.malinaezo.ru/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend (React static build)
    root /var/www/BotFlow/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Telegram Webhooks & Payment callbacks
    location /webhook/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Max upload size (for funnel media uploads)
    client_max_body_size 50M;
}
# Note: After running certbot --nginx -d botflow.malinaezo.ru
# certbot will automatically uncomment and fill the SSL block above
