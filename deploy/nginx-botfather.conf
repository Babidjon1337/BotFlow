# Nginx config for Bot Father
# Place at: /etc/nginx/sites-available/botfather
# Then: ln -s /etc/nginx/sites-available/botfather /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx
#
# Replace bot.yourdomain.ru with your real subdomain

server {
    listen 80;
    server_name bot.yourdomain.ru;

    # Frontend (React static build)
    root /opt/botfather/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Telegram Webhooks & Payment callbacks
    location /webhook/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Max upload size (for funnel media uploads)
    client_max_body_size 50M;
}
# Note: After running certbot --nginx -d bot.yourdomain.ru
# certbot will automatically add SSL/HTTPS blocks below this
